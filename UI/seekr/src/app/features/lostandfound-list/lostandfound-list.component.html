<div class="container admin-page">
    <div class="page-heading">
        <span>Admin</span>
        <h1>Manage Reports</h1>
        <p>Search reports, review item details, and maintain the lost and found list.</p>
    </div>
    <form #form="ngForm" (ngSubmit)="OnFormSubmit()" class="filter-panel">
        <div class="filter-grid">
            <div>
                <label class="form-label">Type</label>
                <select class="form-select" name="Type" [(ngModel)]="filter.Type" aria-label="Default select example">
                    <option selected>Select Type</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>
            <div>
                <label class="form-label">Item</label>
                <input type="text" class="form-control" name="Item" [(ngModel)]="filter.Item">
            </div>
            <div>
                <label class="form-label">Page Size</label>
                <select class="form-select" (ngModelChange)="getDataByPage(filter.PageNumber, $event)" name="MatchFound"
                    [(ngModel)]="filter.PageSize" aria-label="Default select example">
                    <option [ngValue]="10">10</option>
                    <option [ngValue]="20">20</option>
                    <option [ngValue]="50">50</option>
                    <option [ngValue]="100">100</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Search</button>
        </div>
    </form>
    <ng-container *ngIf="lostfoundlist$ | async as items ">
        <div class="table-panel">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Description</th>
                        <th scope="col">Location</th>
                        <th scope="col">Type</th>
                        <th scope="col">Edit</th>
                        <th scope="col">Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of items">
                        <td class="fw-semibold">{{item.title}}</td>
                        <td>{{item.description}}</td>
                        <td>{{item.location}}</td>
                        <td><span class="type-badge">{{item.type}}</span></td>
                        <td><a class="btn btn-outline-success btn-sm"
                                [routerLink]="['/admin/lostandfoundlist/editlostandfound',item.type, item.id]">Edit</a>
                        </td>
                        <td><button class="btn btn-outline-danger btn-sm" type="button"
                                (click)="DeleteFound(item.id)">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <ul class="pagination mt-4">
            <li class="page-item"><a class="page-link" (click)="getDataByPage(currentPage-1,filter.PageSize)">Previous</a></li>
            <li *ngFor="let item of list;let index = index" class="page-item"><a
                    (click)="getDataByPage(index+1,filter.PageSize)" class="page-link">{{index+1}}</a></li>
            <li class="page-item"><a class="page-link" (click)="getDataByPage(currentPage+1,filter.PageSize)">Next</a></li>
        </ul>
    </ng-container>
</div>
