<div class="container">
  <div class="row">
    <div class="col-sm-8"><app-map class="position-relative"></app-map></div>
    <div class="col-sm-4">
      <!--Bar for form submission-->
      <div class="mb-3 mt-3">
        <h4 class="text-center">Tell Us What You Found / Lost</h4>
        <form #form="ngForm" (ngSubmit)="SubmitForm()" class="mt-3">
            <ng-container *ngIf="modal">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" [(ngModel)]="modal.title" name="title">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" [(ngModel)]="modal.description" name="description">
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" [(ngModel)]="modal.location" name="location">
          </div>
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" [(ngModel)]="modal.date" name="date">
          </div>
          <div class="mb-3">
            <label for="formFileMultiple" class="form-label">Image</label>
            <input class="form-control" type="file" [(ngModel)]="modal.imageURL" name="imageURL">
          </div>
          <div class="mb-3">
            <label for="Contact" class="form-label">Contact</label>
            <input type="text" class="form-control" [(ngModel)]="modal.contactinfo" name="contactinfo">
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
          </ng-container>
        </form>
      </div>
    </div>
  </div>
</div>
