<div class="container mt-3">
    <ng-container *ngIf="lostandfoundData$ | async as data">
        <div class="row row-cols-3 row-cols-md-2 g-4" >
            <div class="col" *ngFor="let item of data"x>
                <div class="card h-100">
                    <img src="/8767132.jpg" style="width: 300px; height: 300px;" class="card-img-top" alt="submission image">
                    <div class="card-body">
                        <h5 class="card-title">{{item.title}}</h5>
                        <p class="card-text">{{item.description}}</p>
                        <p class="card-text">Type: {{item.type}}</p>
                        <p class="card-text">Date Posted:</p>
                        <p class="card-text">Contact: {{item.contactinfo}}</p>
                        <a [routerLink]="['/matchfound',item.latitude, item.longitude]" class="btn btn-primary">Match</a>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>
